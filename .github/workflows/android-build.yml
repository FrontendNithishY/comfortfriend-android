name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK exists
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          test -s "$APK"
          ls -l "$APK"
          unzip -l "$APK" | grep -E "AndroidManifest.xml|classes.dex"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Decode release keystore (only when secrets are configured)
        id: ks
        env:
          CF_KEYSTORE_B64: ${{ secrets.CF_KEYSTORE_B64 }}
        run: |
          if [ -n "$CF_KEYSTORE_B64" ]; then
            echo "$CF_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.ks.outputs.present == 'true'
        env:
          CF_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          CF_KEYSTORE_PASSWORD: ${{ secrets.CF_KEYSTORE_PASSWORD }}
          CF_KEY_ALIAS: ${{ secrets.CF_KEY_ALIAS }}
          CF_KEY_PASSWORD: ${{ secrets.CF_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: comfortfriend-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: steps.ks.outputs.present == 'true'
        with:
          name: comfortfriend-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
