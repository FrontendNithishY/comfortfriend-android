name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK exists
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          test -s "$APK"
          ls -l "$APK"
          unzip -l "$APK" | grep -E "AndroidManifest.xml|classes.dex"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Decode release keystore (only when secrets are configured)
        id: ks
        env:
          CF_KEYSTORE_B64: ${{ secrets.CF_KEYSTORE_B64 }}
        run: |
          if [ -n "$CF_KEYSTORE_B64" ]; then
            echo "$CF_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.ks.outputs.present == 'true'
        env:
          CF_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          CF_KEYSTORE_PASSWORD: ${{ secrets.CF_KEYSTORE_PASSWORD }}
          CF_KEY_ALIAS: ${{ secrets.CF_KEY_ALIAS }}
          CF_KEY_PASSWORD: ${{ secrets.CF_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: comfortfriend-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: steps.ks.outputs.present == 'true'
        with:
          name: comfortfriend-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Publish debug APK as a GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-build-${{ github.run_number }}"
          cp "$APK_PATH" "comfortfriend-debug-${TAG}.apk"
          gh release create "$TAG" "comfortfriend-debug-${TAG}.apk" \
            --title "ComfortFriend debug build ${{ github.run_number }}" \
            --notes "Debug APK built from commit ${{ github.sha }}. Install on Android 8.0+ (enable install from unknown sources)." \
            --prerelease
